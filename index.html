<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17LIVE 升級禮與隨機袋圖鑑 - 神魔風格版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* 外層神魔框體 */
        .dex-container {
            width: 100%;
            max-width: 520px;
            background: linear-gradient(180deg, #1f2833 0%, #0b0c10 100%);
            border: 3px solid #c5a059;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
            padding: 15px;
            position: relative;
        }

        /* 頂部 Tab 切換按鈕區 */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: #111;
            border: 2px solid #c5a059;
            color: #c5a059;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .tab-btn:hover {
            background: rgba(197, 160, 89, 0.2);
        }

        .tab-btn.active {
            background: linear-gradient(180deg, #c5a059 0%, #9e7d3b 100%);
            color: #0b0c10;
            border-color: #f1c40f;
            box-shadow: 0 0 12px rgba(241, 196, 15, 0.6);
        }

        /* 標題區塊 */
        .dex-header {
            text-align: center;
            border-bottom: 2px solid #c5a059;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .dex-header h1 {
            font-size: 20px;
            color: #f39c12;
            text-shadow: 0 0 8px rgba(243, 156, 18, 0.6);
            letter-spacing: 1.5px;
            line-height: 1.3;
        }

        .dex-header .subtitle {
            font-size: 13px;
            color: #a0a0a0;
            margin-top: 4px;
        }

        /* 下拉選單區 */
        .gift-select-container {
            margin-bottom: 12px;
            position: relative;
            width: 100%;
        }

        .gift-select {
            width: 100%;
            padding: 12px 15px;
            background: #111;
            border: 2px solid #45a29e;
            color: #66fcf1;
            font-weight: bold;
            font-size: 15px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            box-shadow: 0 0 8px rgba(69, 162, 158, 0.3);
            transition: all 0.3s ease;
        }

        .gift-select:focus {
            border-color: #f39c12;
            box-shadow: 0 0 12px rgba(243, 156, 18, 0.6);
            color: #f39c12;
        }

        .gift-select option {
            background: #151a21;
            color: #ffffff;
            font-size: 14px;
            padding: 10px;
        }

        .gift-select-container::after {
            content: "▼";
            font-size: 12px;
            color: #45a29e;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* 活動說明廣播框 */
        .activity-box {
            background: rgba(69, 162, 158, 0.1);
            border: 1px dashed #45a29e;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            color: #66fcf1;
            margin-bottom: 15px;
            line-height: 1.4;
            display: none; /* 僅在隨機袋模式啟用 */
        }

        /* 卡片展示區 */
        .card-frame {
            position: relative;
            background: #151a21;
            border: 2px solid #45a29e;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            overflow: hidden;
        }

        .card-rarity {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            color: #fff;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            z-index: 2;
        }

        .card-image {
            width: 100%;
            max-width: 200px;
            height: 200px;
            margin: 10px auto;
            border-radius: 8px;
            border: 3px solid #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
            object-fit: cover;
            transition: transform 0.3s ease;
            background-color: #000;
            display: block;
        }

        .card-image:hover {
            transform: scale(1.03);
        }

        .card-name {
            font-size: 19px;
            font-weight: bold;
            color: #66fcf1;
            margin-top: 8px;
        }

        .card-desc {
            font-size: 13px;
            color: #c5a059;
            margin: 8px 0;
            min-height: 38px;
            line-height: 1.4;
        }

        /* 屬性資訊欄 */
        .req-container {
            margin: 6px 0;
            background: rgba(31, 40, 51, 0.8);
            border: 1px solid #c5a059;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .req-container.total-coins {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.1);
        }

        .req-label {
            font-size: 13px;
            color: #45a29e;
            font-weight: bold;
        }

        .total-coins .req-label {
            color: #e67e22;
        }

        .req-value {
            font-size: 14px;
            color: #f1c40f;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(241, 196, 15, 0.5);
        }

        .total-coins .req-value {
            color: #f39c12;
            text-shadow: 0 0 6px rgba(243, 156, 18, 0.6);
        }

        /* 等級 / 獎項按鈕列 */
        .level-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 6px;
            margin-top: 15px;
        }

        .lvl-btn {
            padding: 8px 0;
            background: #1f2833;
            border: 1px solid #c5a059;
            color: #c5a059;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .lvl-btn:hover, .lvl-btn.active {
            background: #c5a059;
            color: #0b0c10;
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.8);
        }

        /* 免責聲明頁尾 (使用標楷體) */
        .dex-footer {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px dashed rgba(197, 160, 89, 0.4);
            text-align: center;
            font-size: 12px;
            color: #a0a0a0;
            line-height: 1.6;
            font-family: "標楷體", "BiauKai", "DFKai-SB", "楷體", "STKaiti", "KaiTi", serif;
        }

        .collab-title {
            font-size: 12px;
            color: #c5a059;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        .collab-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        .collab-badge {
            display: inline-block;
            padding: 6px 12px;
            background: #151a21;
            border: 1px solid #45a29e;
            color: #66fcf1;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .collab-badge:hover {
            background: #c5a059;
            border-color: #f1c40f;
            color: #0b0c10;
            transform: translateY(-2px);
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.7);
        }
    </style>
</head>
<body>

<div class="dex-container">
    <!-- 頂頁 Tab 頁籤 -->
    <div class="nav-tabs">
        <button class="tab-btn active" id="tabGifts" onclick="switchMode('gifts')">升級禮圖鑑</button>
        <button class="tab-btn" id="tabBags" onclick="switchMode('bags')">隨機袋圖鑑</button>
    </div>

    <!-- 標題區 -->
    <div class="dex-header">
        <h1 id="pageTitle">17LIVE 升級禮進化圖鑑</h1>
        <div class="subtitle">(非官方 - 持續更新中)</div>
    </div>

    <!-- 下拉選單 -->
    <div class="gift-select-container">
        <select class="gift-select" id="giftSelect" onchange="switchGift(this.value)">
            <!-- 由 JS 動態生成 -->
        </select>
    </div>

    <!-- 活動說明區塊 (隨機袋模式專用) -->
    <div class="activity-box" id="activityBox">
        <span id="activityDesc">活動說明...</span>
    </div>

    <!-- 主展示卡片 -->
    <div class="card-frame">
        <div class="card-rarity" id="giftRarity">★☆☆☆☆</div>
        <img src="" alt="圖示" class="card-image" id="giftImg">
        <div class="card-name" id="giftName">載入中...</div>
        <div class="card-desc" id="giftDesc">請稍候...</div>

        <!-- 變動標籤 (升級數量 / 獎項額度) -->
        <div class="req-container">
            <span class="req-label" id="reqCountLabel">解鎖所需禮物數量：</span>
            <span class="req-value" id="reqCount">0 個</span>
        </div>

        <!-- 固定標籤 (滿級所需 / 單次金額) -->
        <div class="req-container total-coins">
            <span class="req-label" id="maxCoinsLabel">滿級總計需要：</span>
            <span class="req-value" id="maxCoins">計算中...</span>
        </div>
    </div>

    <!-- 等級/獎項按鈕列 -->
    <div class="level-selector" id="levelSelector"></div>

    <!-- 頁尾標楷體免責聲明 -->
    <div class="dex-footer">
	    【免責聲明】<br>
		本頁面內容僅供玩家交流研討使用，並非營利目的。<br>
        相關圖像與資料版權皆屬 17LIVE 官方所有。<br><br>
		【哪有賭徒天天輸，只有希璐天天哭。】 by 熊熊<br>

        <div class="collab-title">❖ 貢獻與協作者 ❖</div>
        <div class="collab-list" id="collabList"></div>
    </div>
</div>

<script src="giftsData.js"></script>
<script src="mysteryBagsData.js"></script>

<script>
    let currentMode = 'gifts'; 
    let currentGiftKey = '';

    function init() {
        renderCollaborators();
        switchMode('gifts');
    }

    function switchMode(mode) {
        currentMode = mode;

        document.getElementById("tabGifts").classList.toggle("active", mode === 'gifts');
        document.getElementById("tabBags").classList.toggle("active", mode === 'bags');

        const activityBox = document.getElementById("activityBox");

        if (mode === 'gifts') {
            document.getElementById("pageTitle").innerText = "17LIVE 升級禮進化圖鑑";
            document.getElementById("reqCountLabel").innerText = "解鎖所需禮物數量：";
            document.getElementById("maxCoinsLabel").innerText = "滿級總計需要：";
            activityBox.style.display = "none";

            const db = typeof giftsDatabase !== "undefined" ? giftsDatabase : {};
            currentGiftKey = Object.keys(db)[0] || '';
        } else {
            document.getElementById("pageTitle").innerText = "17LIVE 隨機袋獎勵圖鑑";
            document.getElementById("reqCountLabel").innerText = "內容獎額 / 價值：";
            document.getElementById("maxCoinsLabel").innerText = "單次開袋金額：";
            activityBox.style.display = "block";

            const db = typeof mysteryBagsDatabase !== "undefined" ? mysteryBagsDatabase : {};
            currentGiftKey = Object.keys(db)[0] || '';
        }

        renderMainMenu();
        if (currentGiftKey) {
            switchGift(currentGiftKey);
        }
    }

    function getCurrentDatabase() {
        if (currentMode === 'gifts') {
            return typeof giftsDatabase !== "undefined" ? giftsDatabase : {};
        } else {
            return typeof mysteryBagsDatabase !== "undefined" ? mysteryBagsDatabase : {};
        }
    }

    function renderMainMenu() {
        const giftSelect = document.getElementById("giftSelect");
        if (!giftSelect) return;
        giftSelect.innerHTML = "";

        const activeDB = getCurrentDatabase();

        Object.keys(activeDB).forEach(key => {
            const option = document.createElement("option");
            option.value = key;
            option.innerText = activeDB[key].title;
            if (key === currentGiftKey) {
                option.selected = true;
            }
            giftSelect.appendChild(option);
        });
    }

    function switchGift(giftKey) {
        currentGiftKey = giftKey;
        const activeDB = getCurrentDatabase();

        const giftSelect = document.getElementById("giftSelect");
        if (giftSelect && giftSelect.value !== giftKey) {
            giftSelect.value = giftKey;
        }

        const giftData = activeDB[currentGiftKey];
        if (giftData) {
            document.getElementById("maxCoins").innerText = giftData.maxCoins || "尚未計算";
            if (currentMode === 'bags') {
                document.getElementById("activityDesc").innerText = giftData.activityDesc || "暫無活動說明。";
            }
        }

        renderLevelButtons();
        selectLevel(0);
    }

    function renderLevelButtons() {
        const levelSelector = document.getElementById("levelSelector");
        if (!levelSelector) return;
        levelSelector.innerHTML = ""; 

        const activeDB = getCurrentDatabase();
        const levels = activeDB[currentGiftKey]?.levels || [];

        levels.forEach((lvlData, index) => {
            const btn = document.createElement("button");
            btn.className = "lvl-btn";
            btn.innerText = lvlData.level; // 顯示：保底獎 / 次高獎 / 頭獎 等名稱
            btn.onclick = () => selectLevel(index);
            levelSelector.appendChild(btn);
        });
    }

    function selectLevel(index) {
        const activeDB = getCurrentDatabase();
        const data = activeDB[currentGiftKey]?.levels[index];
        if (!data) return;

        document.getElementById("giftName").innerText = data.name;
        document.getElementById("giftRarity").innerText = data.rarity;
        document.getElementById("giftDesc").innerText = data.desc;
        document.getElementById("reqCount").innerText = data.reqCount;

        const imgEl = document.getElementById("giftImg");
        if (imgEl) {
            imgEl.onerror = function() {
                this.onerror = null;
                const encodedText = encodeURIComponent(data.level);
                this.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><rect width="100%" height="100%" fill="%23151a21"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23f1c40f" font-size="22" font-weight="bold">${encodedText}</text></svg>`;
            };
            imgEl.src = data.img;
        }

        const buttons = document.querySelectorAll('.lvl-btn');
        buttons.forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });
    }

    function renderCollaborators() {
        const collabList = document.getElementById("collabList");
        if (!collabList || typeof collaborators === "undefined") return;
        collabList.innerHTML = "";

        collaborators.forEach(collab => {
            const link = document.createElement("a");
            link.className = "collab-badge";
            link.href = collab.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerText = collab.name;
            collabList.appendChild(link);
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
</script>

</body>
</html>
