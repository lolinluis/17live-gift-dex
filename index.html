<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17LIVE 圖鑑與主播生日列表 - 神魔風格版</title>

    <!-- [不蒜子 Busuanzi] 免費瀏覽人次統計腳本 -->
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* 外層神魔框體 */
        .dex-container {
            width: 100%;
            max-width: 520px;
            background: linear-gradient(180deg, #1f2833 0%, #0b0c10 100%);
            border: 3px solid #c5a059;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
            padding: 15px;
            position: relative;
        }

        /* 頂部 Tab 切換區 */
        .nav-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: #111;
            border: 2px solid #c5a059;
            color: #c5a059;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .tab-btn:hover {
            background: rgba(197, 160, 89, 0.2);
        }

        .tab-btn.active {
            background: linear-gradient(180deg, #c5a059 0%, #9e7d3b 100%);
            color: #0b0c10;
            border-color: #f1c40f;
            box-shadow: 0 0 12px rgba(241, 196, 15, 0.6);
        }

        /* 標題區塊 */
        .dex-header {
            text-align: center;
            border-bottom: 2px solid #c5a059;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .dex-header h1 {
            font-size: 20px;
            color: #f39c12;
            text-shadow: 0 0 8px rgba(243, 156, 18, 0.6);
            letter-spacing: 1.5px;
            line-height: 1.3;
        }

        .dex-header .subtitle {
            font-size: 13px;
            color: #a0a0a0;
            margin-top: 4px;
        }

        /* 【升級禮】圖鑑選擇清單 (4欄網格) */
        .gift-grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .gift-grid-item {
            background: #151a21;
            border: 2px solid #45a29e;
            border-radius: 8px;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .gift-grid-item:hover {
            border-color: #f1c40f;
            transform: translateY(-3px);
            box-shadow: 0 0 12px rgba(241, 196, 15, 0.6);
            background: rgba(197, 160, 89, 0.15);
        }

        .gift-grid-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #c5a059;
            background-color: #000;
        }

        .gift-grid-title {
            font-size: 11px;
            color: #66fcf1;
            margin-top: 5px;
            font-weight: bold;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-all;
        }

        .gift-grid-price {
            font-size: 10px;
            color: #f1c40f;
            font-weight: bold;
            margin-top: 3px;
            text-shadow: 0 0 4px rgba(241, 196, 15, 0.4);
        }

        /* 返回選單按鈕 */
        .back-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(180deg, #c5a059 0%, #9e7d3b 100%);
            color: #0b0c10;
            border: 1px solid #f1c40f;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 5;
            box-shadow: 0 0 6px rgba(241, 196, 15, 0.4);
        }

        .back-btn:hover {
            background: #f1c40f;
            transform: scale(1.05);
        }

        /* 【隨機袋卡片式列表與展開手風琴樣式】 */
        .mystery-bag-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bag-card {
            background: #151a21;
            border: 2px solid #45a29e;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .bag-card:hover {
            border-color: #f39c12;
            box-shadow: 0 0 12px rgba(243, 156, 18, 0.4);
        }

        .bag-card.active {
            border-color: #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
        }

        .bag-card-header {
            display: flex;
            align-items: center;
            padding: 12px;
            cursor: pointer;
            user-select: none;
            background: rgba(31, 40, 51, 0.5);
            gap: 12px;
        }

        .bag-card-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            border: 2px solid #c5a059;
            object-fit: cover;
            background-color: #000;
            flex-shrink: 0;
        }

        .bag-card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .bag-card-title {
            font-size: 16px;
            font-weight: bold;
            color: #66fcf1;
            line-height: 1.3;
        }

        .bag-card-price {
            font-size: 13px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 0 0 4px rgba(241, 196, 15, 0.4);
        }

        .bag-card-arrow {
            font-size: 14px;
            color: #45a29e;
            transition: transform 0.3s ease;
            margin-left: 5px;
        }

        .bag-card.active .bag-card-arrow {
            transform: rotate(180deg);
            color: #f39c12;
        }

        /* 折疊展開內容容器 */
        .bag-card-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-in-out;
            background: rgba(11, 12, 16, 0.8);
        }

        .bag-card-body-inner {
            padding: 12px;
            border-top: 1px dashed rgba(197, 160, 89, 0.4);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bag-card-desc {
            background: rgba(31, 40, 51, 0.8);
            border: 1px dashed #45a29e;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px;
            color: #66fcf1;
            line-height: 1.5;
        }

        /* 升級禮卡片展示區 */
        .card-frame {
            position: relative;
            background: #151a21;
            border: 2px solid #45a29e;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            overflow: hidden;
        }

        .card-rarity {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #e74c3c;
            color: #fff;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            z-index: 2;
        }

        .card-image {
            width: 100%;
            max-width: 200px;
            height: 200px;
            margin: 10px auto;
            border-radius: 8px;
            border: 3px solid #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
            object-fit: cover;
            transition: transform 0.3s ease;
            background-color: #000;
            display: block;
        }

        .card-image:hover {
            transform: scale(1.03);
        }

        .card-name {
            font-size: 19px;
            font-weight: bold;
            color: #66fcf1;
            margin-top: 8px;
        }

        .card-desc {
            font-size: 13px;
            color: #c5a059;
            margin: 8px 0;
            min-height: 38px;
            line-height: 1.4;
        }

        .req-container {
            margin: 6px 0;
            background: rgba(31, 40, 51, 0.8);
            border: 1px solid #c5a059;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .req-container.total-coins {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.1);
        }

        .req-label {
            font-size: 13px;
            color: #45a29e;
            font-weight: bold;
        }

        .total-coins .req-label {
            color: #e67e22;
        }

        .req-value {
            font-size: 14px;
            color: #f1c40f;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(241, 196, 15, 0.5);
        }

        .total-coins .req-value {
            color: #f39c12;
            text-shadow: 0 0 6px rgba(243, 156, 18, 0.6);
        }

        .level-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 6px;
            margin-top: 15px;
        }

        .lvl-btn {
            padding: 8px 0;
            background: #1f2833;
            border: 1px solid #c5a059;
            color: #c5a059;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .lvl-btn:hover, .lvl-btn.active {
            background: #c5a059;
            color: #0b0c10;
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.8);
        }

        /* 隨機袋內部獎項列表 */
        .bag-items-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .bag-item-card {
            background: #151a21;
            border: 1px solid #45a29e;
            border-radius: 6px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bag-item-left {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .bag-item-header {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bag-item-tag {
            background: #e74c3c;
            color: #fff;
            padding: 1px 5px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 3px;
        }

        .bag-item-name {
            font-size: 13px;
            font-weight: bold;
            color: #66fcf1;
        }

        .bag-item-rarity {
            font-size: 11px;
            color: #e74c3c;
        }

        .bag-item-desc {
            font-size: 11px;
            color: #c5a059;
        }

        .bag-item-right {
            text-align: right;
            flex-shrink: 0;
        }

        .bag-item-value {
            font-size: 12px;
            color: #f1c40f;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(241, 196, 15, 0.4);
        }

        /* 主播生日列表頁面樣式 */
        .streamer-birthday-container {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .streamer-card {
            background: #151a21;
            border: 1px solid #45a29e;
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .streamer-card:hover {
            border-color: #f39c12;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
            background: rgba(69, 162, 158, 0.1);
        }

        .streamer-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(197, 160, 89, 0.3);
            padding-bottom: 6px;
        }

        .streamer-date {
            font-size: 16px;
            font-weight: bold;
            color: #f1c40f;
            min-width: 60px;
        }

        .streamer-name {
            font-size: 16px;
            font-weight: bold;
            flex: 1;
            padding: 0 10px;
        }

        .streamer-link {
            color: #66fcf1;
            text-decoration: none;
            transition: color 0.2s;
        }

        .streamer-link:hover {
            color: #f39c12;
            text-decoration: underline;
        }

        .streamer-zodiac {
            font-size: 14px;
            font-weight: bold;
            color: #e67e22;
            background: rgba(230, 126, 34, 0.15);
            border: 1px solid #e67e22;
            padding: 2px 8px;
            border-radius: 12px;
            white-space: nowrap;
        }

        .streamer-row-bottom {
            font-size: 12px;
            color: #c5a059;
            line-height: 1.5;
            word-break: break-all;
        }

        /* 問題 QA 手風琴樣式 */
        .qa-container {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .qa-item {
            background: #151a21;
            border: 1px solid #45a29e;
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .qa-item:hover, .qa-item.active {
            border-color: #f39c12;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
        }

        .qa-header {
            padding: 12px 15px;
            background: rgba(31, 40, 51, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .qa-title {
            font-size: 14px;
            font-weight: bold;
            color: #66fcf1;
        }

        .qa-item.active .qa-title {
            color: #f39c12;
        }

        .qa-arrow {
            font-size: 12px;
            color: #45a29e;
            transition: transform 0.3s ease;
        }

        .qa-item.active .qa-arrow {
            transform: rotate(180deg);
            color: #f39c12;
        }

        .qa-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: rgba(11, 12, 16, 0.6);
        }

        .qa-content-inner {
            padding: 12px 15px;
            font-size: 13px;
            color: #c5a059;
            line-height: 1.6;
            border-top: 1px dashed rgba(69, 162, 158, 0.3);
        }

        /* 頁尾免責聲明與計數器 */
        .dex-footer {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px dashed rgba(197, 160, 89, 0.4);
            text-align: center;
            font-size: 12px;
            color: #a0a0a0;
            line-height: 1.6;
            font-family: "標楷體", "BiauKai", "DFKai-SB", "楷體", "STKaiti", "KaiTi", serif;
        }

        .collab-title {
            font-size: 12px;
            color: #c5a059;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        .collab-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        .collab-badge {
            display: inline-block;
            padding: 6px 12px;
            background: #151a21;
            border: 1px solid #45a29e;
            color: #66fcf1;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .collab-badge:hover {
            background: #c5a059;
            border-color: #f1c40f;
            color: #0b0c10;
            transform: translateY(-2px);
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.7);
        }

        .counter-container {
            margin-top: 15px;
            padding: 8px 12px;
            background: rgba(31, 40, 51, 0.6);
            border: 1px solid #c5a059;
            border-radius: 6px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        .counter-label {
            font-size: 12px;
            color: #45a29e;
            font-weight: bold;
        }

        .counter-value {
            font-size: 13px;
            color: #f1c40f;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(241, 196, 15, 0.5);
        }
    </style>
</head>
<body>

<div class="dex-container">
    <!-- 頂頁 Tab 頁籤 -->
    <div class="nav-tabs">
        <button class="tab-btn active" id="tabGifts" onclick="switchMode('gifts')">升級禮</button>
        <button class="tab-btn" id="tabBags" onclick="switchMode('bags')">隨機袋</button>
        <button class="tab-btn" id="tabStreamers" onclick="switchMode('streamers')">主播生日</button>
        <button class="tab-btn" id="tabQA" onclick="switchMode('qa')">問題QA</button>
    </div>

    <!-- 標題區 -->
    <div class="dex-header">
        <h1 id="pageTitle">17LIVE 升級禮進化圖鑑</h1>
        <div class="subtitle">(非官方 - 持續更新中)</div>
    </div>

    <!-- 【升級禮】圖鑑選擇清單 (4欄網格) -->
    <div class="gift-grid-container" id="giftGridArea"></div>

    <!-- 【隨機袋】卡片手風琴列表區 -->
    <div class="mystery-bag-list" id="mysteryBagList" style="display: none;"></div>

    <!-- [升級禮模式] 主展示卡片 -->
    <div id="giftDisplayArea" style="display: none;">
        <div class="card-frame">
            <button class="back-btn" id="btnBackToGrid" onclick="backToGiftGrid()">↩ 返回選單</button>
            <div class="card-rarity" id="giftRarity">★☆☆☆☆</div>
            <img src="" alt="圖示" class="card-image" id="giftImg">
            <div class="card-name" id="giftName">載入中...</div>
            <div class="card-desc" id="giftDesc">請稍候...</div>

            <div class="req-container">
                <span class="req-label">解鎖所需禮物數量：</span>
                <span class="req-value" id="reqCount">0 個</span>
            </div>

            <div class="req-container total-coins">
                <span class="req-label">滿級總計需要：</span>
                <span class="req-value" id="maxCoins">計算中...</span>
            </div>
        </div>

        <div class="level-selector" id="levelSelector"></div>
    </div>

    <!-- [主播生日模式] 兩行卡片式清單列表 -->
    <div class="streamer-birthday-container" id="streamerBirthdayContainer"></div>

    <!-- [問題QA模式] 可伸縮手風琴內容區 -->
    <div class="qa-container" id="qaContainer"></div>

    <!-- 頁尾免責聲明與計數器 -->
    <div class="dex-footer">
        【免責聲明】<br>
        本頁面內容僅供玩家交流研討使用，並非營利目的。<br>
        相關圖像與資料版權皆屬 17LIVE 官方所有。<br><br>
        【哪有賭徒天天輸，只有希璐天天哭。】 by 熊熊<br><br>
        ✨🎂祝希璐生日快樂🎂✨<br>

        <div class="collab-title">❖ 貢獻與協作者 ❖</div>
        <div class="collab-list" id="collabList"></div>

        <div>
            <div class="counter-container">
                <span class="counter-label">❖ 累積瀏覽人次：</span>
                <span class="counter-value" id="busuanzi_value_page_pv">...</span> 次
            </div>
        </div>
    </div>
</div>

<script src="giftsData.js"></script>
<script src="mysteryBagsData.js"></script>
<script src="streamersData.js"></script>
<script src="qaData.js"></script>
<script src="qa.js"></script>

<script>
    let currentMode = 'gifts'; 
    let currentGiftKey = '';

    function init() {
        renderCollaborators();
        switchMode('gifts');
    }

    function switchMode(mode) {
        currentMode = mode;

        document.getElementById("tabGifts").classList.toggle("active", mode === 'gifts');
        document.getElementById("tabBags").classList.toggle("active", mode === 'bags');
        document.getElementById("tabStreamers").classList.toggle("active", mode === 'streamers');
        document.getElementById("tabQA").classList.toggle("active", mode === 'qa');

        const giftGridArea = document.getElementById("giftGridArea");
        const giftDisplayArea = document.getElementById("giftDisplayArea");
        const mysteryBagList = document.getElementById("mysteryBagList");
        const streamerBirthdayContainer = document.getElementById("streamerBirthdayContainer");
        const qaContainer = document.getElementById("qaContainer");

        if (mode === 'gifts') {
            document.getElementById("pageTitle").innerText = "17LIVE 升級禮進化圖鑑";
            giftGridArea.style.display = "grid";
            giftDisplayArea.style.display = "none";
            mysteryBagList.style.display = "none";
            streamerBirthdayContainer.style.display = "none";
            qaContainer.style.display = "none";

            renderGiftGrid();

        } else if (mode === 'bags') {
            document.getElementById("pageTitle").innerText = "17LIVE 隨機袋獎勵圖鑑";
            giftGridArea.style.display = "none";
            giftDisplayArea.style.display = "none";
            mysteryBagList.style.display = "flex";
            streamerBirthdayContainer.style.display = "none";
            qaContainer.style.display = "none";

            renderMysteryBagList();

        } else if (mode === 'streamers') {
            document.getElementById("pageTitle").innerText = "17 LIVE 主播生日列表";
            giftGridArea.style.display = "none";
            giftDisplayArea.style.display = "none";
            mysteryBagList.style.display = "none";
            streamerBirthdayContainer.style.display = "flex";
            qaContainer.style.display = "none";

            renderStreamerBirthdayList();

        } else if (mode === 'qa') {
            document.getElementById("pageTitle").innerText = "17LIVE 常見問題 QA";
            giftGridArea.style.display = "none";
            giftDisplayArea.style.display = "none";
            mysteryBagList.style.display = "none";
            streamerBirthdayContainer.style.display = "none";
            qaContainer.style.display = "flex";

            renderQAList();
        }
    }

    function getCurrentDatabase() {
        return currentMode === 'gifts' 
            ? (typeof giftsDatabase !== "undefined" ? giftsDatabase : {})
            : (typeof mysteryBagsDatabase !== "undefined" ? mysteryBagsDatabase : {});
    }

    /* 渲染升級禮網格 */
    function renderGiftGrid() {
        const giftGridArea = document.getElementById("giftGridArea");
        if (!giftGridArea) return;
        giftGridArea.innerHTML = "";

        const db = typeof giftsDatabase !== "undefined" ? giftsDatabase : {};

        Object.keys(db).forEach(key => {
            const gift = db[key];
            const lvl0Data = gift.levels ? gift.levels[0] : null;
            const imgSrc = lvl0Data ? lvl0Data.img : "";
            
            let singlePrice = "";
            if (gift.price !== undefined && gift.price !== null && gift.price !== "") {
                singlePrice = String(gift.price);
            } else if (gift.levels && gift.levels[1] && gift.levels[1].reqCount) {
                singlePrice = String(gift.levels[1].reqCount);
            } else {
                singlePrice = "0";
            }

            if (!singlePrice.endsWith("幣")) {
                singlePrice += "幣";
            }

            const item = document.createElement("div");
            item.className = "gift-grid-item";
            item.onclick = () => selectGiftFromGrid(key);

            item.innerHTML = `
                <img class="gift-grid-img" src="${imgSrc}" alt="${gift.title}" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'80\' height=\'80\' viewBox=\'0 0 80 80\'><rect width=\'100%\' height=\'100%\' fill=\'%23151a21\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23f1c40f\' font-size=\'10\'>Lv.0</text></svg>';">
                <div class="gift-grid-title">${gift.title}</div>
                <div class="gift-grid-price">${singlePrice}</div>
            `;
            giftGridArea.appendChild(item);
        });
    }

    function selectGiftFromGrid(giftKey) {
        currentGiftKey = giftKey;
        document.getElementById("giftGridArea").style.display = "none";
        document.getElementById("giftDisplayArea").style.display = "block";

        const data = giftsDatabase[currentGiftKey];
        if (!data) return;

        document.getElementById("maxCoins").innerText = data.maxCoins || "尚未計算";
        renderLevelButtons();
        selectLevel(0);
    }

    function backToGiftGrid() {
        document.getElementById("giftDisplayArea").style.display = "none";
        document.getElementById("giftGridArea").style.display = "grid";
    }

    /* 渲染隨機袋列表 (卡片 + 手風琴展開) */
    function renderMysteryBagList() {
        const listContainer = document.getElementById("mysteryBagList");
        if (!listContainer) return;
        listContainer.innerHTML = "";

        const db = typeof mysteryBagsDatabase !== "undefined" ? mysteryBagsDatabase : {};

        Object.keys(db).forEach(key => {
            const bag = db[key];
            const priceText = bag.maxCoins ? (bag.maxCoins.includes("幣") ? bag.maxCoins : bag.maxCoins + " / 次") : "單次金額未定";
            const items = bag.items || bag.levels || [];

            const card = document.createElement("div");
            card.className = "bag-card";

            // 生成獎項 HTML
            let itemsHtml = "";
            items.forEach(item => {
                const reqText = item.reward || item.reqCount || "無備註";
                itemsHtml += `
                    <div class="bag-item-card">
                        <div class="bag-item-left">
                            <div class="bag-item-header">
                                <span class="bag-item-tag">${item.tag || item.level || '獎項'}</span>
                                <span class="bag-item-name">${item.name}</span>
                                <span class="bag-item-rarity">${item.rarity || ''}</span>
                            </div>
                            <div class="bag-item-desc">${item.desc || ''}</div>
                        </div>
                        <div class="bag-item-right">
                            <div class="bag-item-value">${reqText}</div>
                        </div>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="bag-card-header" onclick="toggleBagCard(this)">
                    <img class="bag-card-thumb" src="${bag.img || ''}" alt="${bag.title}" onerror="this.onerror=null;const text=encodeURIComponent('${bag.title}');this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\' viewBox=\'0 0 60 60\'><rect width=\'100%\' height=\'100%\' fill=\'%23151a21\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23f1c40f\' font-size=\'10\'>${text}</text></svg>';">
                    <div class="bag-card-info">
                        <div class="bag-card-title">${bag.title}</div>
                        <div class="bag-card-price">單次：${priceText}</div>
                    </div>
                    <div class="bag-card-arrow">▼</div>
                </div>
                <div class="bag-card-body">
                    <div class="bag-card-body-inner">
                        <div class="bag-card-desc">${bag.activityDesc || '暫無活動說明。'}</div>
                        <div class="bag-items-grid">
                            ${itemsHtml}
                        </div>
                    </div>
                </div>
            `;

            listContainer.appendChild(card);
        });
    }

    /* 隨機袋卡片手風琴展開/收合控制 */
    function toggleBagCard(headerEl) {
        const card = headerEl.parentElement;
        const body = card.querySelector(".bag-card-body");
        const isActive = card.classList.contains("active");

        if (isActive) {
            card.classList.remove("active");
            body.style.maxHeight = null;
        } else {
            card.classList.add("active");
            body.style.maxHeight = body.scrollHeight + "px";
        }
    }

    /* 渲染主播生日列表 */
    function renderStreamerBirthdayList() {
        const container = document.getElementById("streamerBirthdayContainer");
        if (!container) return;
        container.innerHTML = "";

        const streamers = typeof streamersDatabase !== "undefined" ? streamersDatabase : [];

        streamers.forEach(item => {
            const card = document.createElement("div");
            card.className = "streamer-card";

            card.innerHTML = `
                <div class="streamer-row-top">
                    <span class="streamer-date">${item.date || ''}</span>
                    <span class="streamer-name">
                        <a href="${item.url || '#'}" target="_blank" rel="noopener noreferrer" class="streamer-link">
                            ${item.name || ''}
                        </a>
                    </span>
                    <span class="streamer-zodiac">${item.zodiac || '未知'}</span>
                </div>
                <div class="streamer-row-bottom">
                    ${item.intro || '暫無詳細簡介'}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function renderLevelButtons() {
        const levelSelector = document.getElementById("levelSelector");
        if (!levelSelector) return;
        levelSelector.innerHTML = ""; 

        const activeDB = getCurrentDatabase();
        const levels = activeDB[currentGiftKey]?.levels || [];

        levels.forEach((lvlData, index) => {
            const btn = document.createElement("button");
            btn.className = "lvl-btn";
            btn.innerText = lvlData.level;
            btn.onclick = () => selectLevel(index);
            levelSelector.appendChild(btn);
        });
    }

    function selectLevel(index) {
        const activeDB = getCurrentDatabase();
        const data = activeDB[currentGiftKey]?.levels[index];
        if (!data) return;

        document.getElementById("giftName").innerText = data.name;
        document.getElementById("giftRarity").innerText = data.rarity;
        document.getElementById("giftDesc").innerText = data.desc;
        document.getElementById("reqCount").innerText = data.reqCount;

        const imgEl = document.getElementById("giftImg");
        if (imgEl) {
            imgEl.onerror = function() {
                this.onerror = null;
                const encodedText = encodeURIComponent(data.level);
                this.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><rect width="100%" height="100%" fill="%23151a21"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23f1c40f" font-size="22" font-weight="bold">${encodedText}</text></svg>`;
            };
            imgEl.src = data.img;
        }

        const buttons = document.querySelectorAll('.lvl-btn');
        buttons.forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });
    }

    function renderCollaborators() {
        const collabList = document.getElementById("collabList");
        if (!collabList || typeof collaborators === "undefined") return;
        collabList.innerHTML = "";

        collaborators.forEach(collab => {
            const link = document.createElement("a");
            link.className = "collab-badge";
            link.href = collab.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerText = collab.name;
            collabList.appendChild(link);
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
</script>

</body>
</html>
