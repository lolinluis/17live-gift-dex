<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17LIVE 升級禮物圖鑑 - 神魔風格版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* 外層神魔框體 */
        .dex-container {
            width: 100%;
            max-width: 520px;
            background: linear-gradient(180deg, #1f2833 0%, #0b0c10 100%);
            border: 3px solid #c5a059;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
            padding: 15px;
            position: relative;
        }

        /* 標題區塊 */
        .dex-header {
            text-align: center;
            border-bottom: 2px solid #c5a059;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .dex-header h1 {
            font-size: 20px;
            color: #f39c12;
            text-shadow: 0 0 8px rgba(243, 156, 18, 0.6);
            letter-spacing: 1.5px;
            line-height: 1.3;
        }

        .dex-header .subtitle {
            font-size: 13px;
            color: #a0a0a0;
            margin-top: 4px;
        }

        /* 下拉式選單區塊容器 */
        .gift-select-container {
            margin-bottom: 15px;
            position: relative;
            width: 100%;
        }

        /* 下拉選單風格 (針對手機與神魔風格優化) */
        .gift-select {
            width: 100%;
            padding: 12px 15px;
            background: #111;
            border: 2px solid #45a29e;
            color: #66fcf1;
            font-weight: bold;
            font-size: 15px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            box-shadow: 0 0 8px rgba(69, 162, 158, 0.3);
            transition: all 0.3s ease;
        }

        .gift-select:focus {
            border-color: #f39c12;
            box-shadow: 0 0 12px rgba(243, 156, 18, 0.6);
            color: #f39c12;
        }

        .gift-select option {
            background: #151a21;
            color: #ffffff;
            font-size: 14px;
            padding: 10px;
        }

        /* 下拉選單右側金屬箭頭圖標 */
        .gift-select-container::after {
            content: "▼";
            font-size: 12px;
            color: #45a29e;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* 卡片展示區 */
        .card-frame {
            position: relative;
            background: #151a21;
            border: 2px solid #45a29e;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            overflow: hidden;
        }

        .card-rarity {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            color: #fff;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            z-index: 2;
        }

        /* 方形卡片展示圖案樣式 */
        .card-image {
            width: 100%;
            max-width: 200px;
            height: 200px;
            margin: 10px auto;
            border-radius: 8px;
            border: 3px solid #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
            object-fit: cover;
            transition: transform 0.3s ease;
            background-color: #000;
            display: block;
        }

        .card-image:hover {
            transform: scale(1.03);
        }

        .card-name {
            font-size: 19px;
            font-weight: bold;
            color: #66fcf1;
            margin-top: 8px;
        }

        .card-desc {
            font-size: 13px;
            color: #c5a059;
            margin: 8px 0;
            min-height: 38px;
            line-height: 1.4;
        }

        /* 升級資訊區塊 */
        .req-container {
            margin: 6px 0;
            background: rgba(31, 40, 51, 0.8);
            border: 1px solid #c5a059;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .req-container.total-coins {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.1);
        }

        .req-label {
            font-size: 13px;
            color: #45a29e;
            font-weight: bold;
        }

        .total-coins .req-label {
            color: #e67e22;
        }

        .req-value {
            font-size: 14px;
            color: #f1c40f;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(241, 196, 15, 0.5);
        }

        .total-coins .req-value {
            color: #f39c12;
            text-shadow: 0 0 6px rgba(243, 156, 18, 0.6);
        }

        /* 等級選擇按鈕區 */
        .level-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 6px;
            margin-top: 15px;
        }

        .lvl-btn {
            padding: 8px 0;
            background: #1f2833;
            border: 1px solid #c5a059;
            color: #c5a059;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .lvl-btn:hover, .lvl-btn.active {
            background: #c5a059;
            color: #0b0c10;
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.8);
        }

        /* 免責聲明頁尾 */
        .dex-footer {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px dashed rgba(197, 160, 89, 0.4);
            text-align: center;
            font-size: 11px;
            color: #8892b0;
            line-height: 1.5;
        }

        .collab-title {
            font-size: 12px;
            color: #c5a059;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .collab-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .collab-badge {
            display: inline-block;
            padding: 6px 12px;
            background: #151a21;
            border: 1px solid #45a29e;
            color: #66fcf1;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .collab-badge:hover {
            background: #c5a059;
            border-color: #f1c40f;
            color: #0b0c10;
            transform: translateY(-2px);
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.7);
        }
    </style>
</head>
<body>

<div class="dex-container">
    <div class="dex-header">
        <h1>17LIVE 升級禮進化圖鑑</h1>
        <div class="subtitle">(非官方 - 持續更新中)</div>
    </div>

    <!-- 禮物類別下拉式選單 -->
    <div class="gift-select-container">
        <select class="gift-select" id="giftSelect" onchange="switchGift(this.value)">
            <!-- 由 JS 動態生成選項 -->
        </select>
    </div>

    <!-- 主展示卡片 -->
    <div class="card-frame">
        <div class="card-rarity" id="giftRarity">★☆☆☆☆</div>
        <img src="" alt="禮物圖示" class="card-image" id="giftImg">
        <div class="card-name" id="giftName">載入中...</div>
        <div class="card-desc" id="giftDesc">請稍候...</div>

        <!-- 升級所需禮物數量 -->
        <div class="req-container">
            <span class="req-label">解鎖所需禮物數量：</span>
            <span class="req-value" id="reqCount">0 個</span>
        </div>

        <!-- 滿級總計寶寶幣 -->
        <div class="req-container total-coins">
            <span class="req-label">滿級總計需要：</span>
            <span class="req-value" id="maxCoins">計算中...</span>
        </div>
    </div>

    <!-- 進化等級切換按鈕區 -->
    <div class="level-selector" id="levelSelector"></div>

    <!-- 頁尾免責聲明與協作者名單區塊 -->
    <div class="dex-footer">
        【免責聲明】<br>
		本頁面內容僅供玩家交流研討使用，並非營利目的。<br>
        相關圖像與資料版權皆屬 17LIVE 官方所有。<br><br>
		【哪有賭徒天天輸，只有希璐天天哭。】 by 熊熊<br>

        <div class="collab-title">❖ 貢獻與協作者 ❖</div>
        <div class="collab-list" id="collabList"></div>
    </div>
</div>

<!-- 先載入資料庫，再執行介面渲染邏輯 -->
<script src="giftsData.js"></script>

<script>
    let currentGiftKey = 'banquet'; // 預設選取的禮物

    function init() {
        // 確保資料庫有成功載入
        if (typeof giftsDatabase === "undefined") {
            console.error("找不到 giftsDatabase，請確認 giftsData.js 檔案是否正確引入！");
            return;
        }
        renderCollaborators();
        renderMainMenu();
        switchGift('banquet');
    }

    // 動態渲染協作者名牌
    function renderCollaborators() {
        const collabList = document.getElementById("collabList");
        if (!collabList || typeof collaborators === "undefined") return;
        collabList.innerHTML = "";

        collaborators.forEach(collab => {
            const link = document.createElement("a");
            link.className = "collab-badge";
            link.href = collab.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerText = collab.name;
            collabList.appendChild(link);
        });
    }

    // 動態渲染下拉選單選項
    function renderMainMenu() {
        const giftSelect = document.getElementById("giftSelect");
        if (!giftSelect) return;
        giftSelect.innerHTML = "";

        Object.keys(giftsDatabase).forEach(key => {
            const option = document.createElement("option");
            option.value = key;
            option.innerText = giftsDatabase[key].title;
            if (key === currentGiftKey) {
                option.selected = true;
            }
            giftSelect.appendChild(option);
        });
    }

    // 切換禮物主類別
    function switchGift(giftKey) {
        currentGiftKey = giftKey;

        const giftSelect = document.getElementById("giftSelect");
        if (giftSelect && giftSelect.value !== giftKey) {
            giftSelect.value = giftKey;
        }

        const giftData = giftsDatabase[currentGiftKey];
        if (giftData) {
            document.getElementById("maxCoins").innerText = giftData.maxCoins || "尚未計算";
        }

        renderLevelButtons();
        selectLevel(0);
    }

    // 動態生成等級按鈕
    function renderLevelButtons() {
        const levelSelector = document.getElementById("levelSelector");
        if (!levelSelector) return;
        levelSelector.innerHTML = ""; 

        const levels = giftsDatabase[currentGiftKey].levels;

        levels.forEach((lvlData, index) => {
            const btn = document.createElement("button");
            btn.className = "lvl-btn";
            btn.innerText = lvlData.level;
            btn.onclick = () => selectLevel(index);
            levelSelector.appendChild(btn);
        });
    }

    // 切換等級
    function selectLevel(index) {
        const data = giftsDatabase[currentGiftKey].levels[index];
        if (!data) return;

        document.getElementById("giftName").innerText = data.name;
        document.getElementById("giftRarity").innerText = data.rarity;
        document.getElementById("giftDesc").innerText = data.desc;
        document.getElementById("reqCount").innerText = data.reqCount;

        const imgEl = document.getElementById("giftImg");
        if (imgEl) {
            imgEl.onerror = function() {
                this.onerror = null;
                const encodedText = encodeURIComponent(data.level);
                this.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><rect width="100%" height="100%" fill="%23151a21"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23f1c40f" font-size="22" font-weight="bold">${encodedText}</text></svg>`;
            };
            imgEl.src = data.img;
        }

        const buttons = document.querySelectorAll('.lvl-btn');
        buttons.forEach((btn, i) => {
            if (i === index) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    // 安全初始化網頁
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
</script>

</body>
</html>
