<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17LIVE 圖鑑與主播生日列表 - 神魔風格版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* 外層神魔框體 */
        .dex-container {
            width: 100%;
            max-width: 520px;
            background: linear-gradient(180deg, #1f2833 0%, #0b0c10 100%);
            border: 3px solid #c5a059;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
            padding: 15px;
            position: relative;
        }

        /* 頂部 Tab 切換區 */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: #111;
            border: 2px solid #c5a059;
            color: #c5a059;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .tab-btn:hover {
            background: rgba(197, 160, 89, 0.2);
        }

        .tab-btn.active {
            background: linear-gradient(180deg, #c5a059 0%, #9e7d3b 100%);
            color: #0b0c10;
            border-color: #f1c40f;
            box-shadow: 0 0 12px rgba(241, 196, 15, 0.6);
        }

        /* 標題區塊 */
        .dex-header {
            text-align: center;
            border-bottom: 2px solid #c5a059;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .dex-header h1 {
            font-size: 20px;
            color: #f39c12;
            text-shadow: 0 0 8px rgba(243, 156, 18, 0.6);
            letter-spacing: 1.5px;
            line-height: 1.3;
        }

        .dex-header .subtitle {
            font-size: 13px;
            color: #a0a0a0;
            margin-top: 4px;
        }

        /* 下拉選單區 */
        .gift-select-container {
            margin-bottom: 12px;
            position: relative;
            width: 100%;
        }

        .gift-select {
            width: 100%;
            padding: 12px 15px;
            background: #111;
            border: 2px solid #45a29e;
            color: #66fcf1;
            font-weight: bold;
            font-size: 15px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            box-shadow: 0 0 8px rgba(69, 162, 158, 0.3);
            transition: all 0.3s ease;
        }

        .gift-select:focus {
            border-color: #f39c12;
            box-shadow: 0 0 12px rgba(243, 156, 18, 0.6);
            color: #f39c12;
        }

        .gift-select option {
            background: #151a21;
            color: #ffffff;
            font-size: 14px;
            padding: 10px;
        }

        .gift-select-container::after {
            content: "▼";
            font-size: 12px;
            color: #45a29e;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* 隨機袋頂部主圖面板 */
        .bag-hero-panel {
            background: #151a21;
            border: 2px solid #45a29e;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        .bag-main-img {
            width: 100%;
            max-width: 180px;
            height: 180px;
            margin: 0 auto 12px auto;
            border-radius: 8px;
            border: 3px solid #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
            object-fit: cover;
            background-color: #000;
            display: block;
        }

        .bag-desc-box {
            background: rgba(31, 40, 51, 0.8);
            border: 1px dashed #45a29e;
            border-radius: 6px;
            padding: 10px;
            font-size: 12px;
            color: #66fcf1;
            line-height: 1.5;
            margin-bottom: 8px;
            text-align: left;
        }

        .bag-price-container {
            background: rgba(243, 156, 18, 0.1);
            border: 1px solid #f39c12;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 升級禮卡片展示區 */
        .card-frame {
            position: relative;
            background: #151a21;
            border: 2px solid #45a29e;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            overflow: hidden;
        }

        .card-rarity {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            color: #fff;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            z-index: 2;
        }

        .card-image {
            width: 100%;
            max-width: 200px;
            height: 200px;
            margin: 10px auto;
            border-radius: 8px;
            border: 3px solid #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
            object-fit: cover;
            transition: transform 0.3s ease;
            background-color: #000;
            display: block;
        }

        .card-image:hover {
            transform: scale(1.03);
        }

        .card-name {
            font-size: 19px;
            font-weight: bold;
            color: #66fcf1;
            margin-top: 8px;
        }

        .card-desc {
            font-size: 13px;
            color: #c5a059;
            margin: 8px 0;
            min-height: 38px;
            line-height: 1.4;
        }

        .req-container {
            margin: 6px 0;
            background: rgba(31, 40, 51, 0.8);
            border: 1px solid #c5a059;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .req-container.total-coins {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.1);
        }

        .req-label {
            font-size: 13px;
            color: #45a29e;
            font-weight: bold;
        }

        .total-coins .req-label {
            color: #e67e22;
        }

        .req-value {
            font-size: 14px;
            color: #f1c40f;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(241, 196, 15, 0.5);
        }

        .total-coins .req-value {
            color: #f39c12;
            text-shadow: 0 0 6px rgba(243, 156, 18, 0.6);
        }

        .level-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 6px;
            margin-top: 15px;
        }

        .lvl-btn {
            padding: 8px 0;
            background: #1f2833;
            border: 1px solid #c5a059;
            color: #c5a059;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .lvl-btn:hover, .lvl-btn.active {
            background: #c5a059;
            color: #0b0c10;
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.8);
        }

        /* 隨機袋獎項列表 */
        .bag-items-grid {
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .bag-item-card {
            background: #151a21;
            border: 1px solid #45a29e;
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bag-item-left {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .bag-item-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bag-item-tag {
            background: #e74c3c;
            color: #fff;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 3px;
        }

        .bag-item-name {
            font-size: 14px;
            font-weight: bold;
            color: #66fcf1;
        }

        .bag-item-rarity {
            font-size: 11px;
            color: #e74c3c;
        }

        .bag-item-desc {
            font-size: 11px;
            color: #c5a059;
        }

        .bag-item-right {
            text-align: right;
            flex-shrink: 0;
        }

        .bag-item-value {
            font-size: 13px;
            color: #f1c40f;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(241, 196, 15, 0.4);
        }

        /* [新增] 主播生日列表頁面樣式 */
        .streamer-birthday-container {
            display: none;
            background: #151a21;
            border: 2px solid #45a29e;
            border-radius: 8px;
            overflow: hidden;
        }

        .birthday-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .birthday-table th {
            background: rgba(197, 160, 89, 0.2);
            color: #f39c12;
            padding: 10px 8px;
            text-align: left;
            border-bottom: 2px solid #c5a059;
            font-weight: bold;
        }

        .birthday-table td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(69, 162, 158, 0.2);
            vertical-align: middle;
        }

        .birthday-table tr:last-child td {
            border-bottom: none;
        }

        .birthday-table tr:hover {
            background: rgba(69, 162, 158, 0.1);
        }

        .date-col {
            width: 70px;
            color: #f1c40f;
            font-weight: bold;
            text-align: center;
        }

        .name-col {
            width: 130px;
        }

        .streamer-link {
            color: #66fcf1;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }

        .streamer-link:hover {
            color: #f39c12;
            text-decoration: underline;
        }

        .intro-col {
            color: #c5a059;
            font-size: 12px;
            line-height: 1.3;
        }

        /* 頁尾免責聲明 */
        .dex-footer {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px dashed rgba(197, 160, 89, 0.4);
            text-align: center;
            font-size: 12px;
            color: #a0a0a0;
            line-height: 1.6;
            font-family: "標楷體", "BiauKai", "DFKai-SB", "楷體", "STKaiti", "KaiTi", serif;
        }

        .collab-title {
            font-size: 12px;
            color: #c5a059;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        .collab-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        .collab-badge {
            display: inline-block;
            padding: 6px 12px;
            background: #151a21;
            border: 1px solid #45a29e;
            color: #66fcf1;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .collab-badge:hover {
            background: #c5a059;
            border-color: #f1c40f;
            color: #0b0c10;
            transform: translateY(-2px);
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.7);
        }
    </style>
</head>
<body>

<div class="dex-container">
    <!-- 頂頁 Tab 頁籤 (擴充為 3 個 Tab) -->
    <div class="nav-tabs">
        <button class="tab-btn active" id="tabGifts" onclick="switchMode('gifts')">升級禮</button>
        <button class="tab-btn" id="tabBags" onclick="switchMode('bags')">隨機袋</button>
        <button class="tab-btn" id="tabStreamers" onclick="switchMode('streamers')">主播生日</button>
    </div>

    <!-- 標題區 -->
    <div class="dex-header">
        <h1 id="pageTitle">17LIVE 升級禮進化圖鑑</h1>
        <div class="subtitle">(非官方 - 持續更新中)</div>
    </div>

    <!-- 下拉選單 (升級禮與隨機袋模式使用) -->
    <div class="gift-select-container" id="selectContainer">
        <select class="gift-select" id="giftSelect" onchange="switchGift(this.value)">
            <!-- 由 JS 動態生成 -->
        </select>
    </div>

    <!-- [隨機袋模式] 頂部隨機袋主圖與說明面板 -->
    <div class="bag-hero-panel" id="bagHeroPanel">
        <img class="bag-main-img" id="bagMainImg" src="" alt="隨機袋圖示">
        <div class="bag-desc-box" id="bagDesc">活動說明...</div>
        <div class="bag-price-container">
            <span class="req-label" style="color:#e67e22;">單次開袋金額：</span>
            <span class="req-value" id="bagPrice">300 寶寶幣 / 次</span>
        </div>
    </div>

    <!-- [升級禮模式] 主展示卡片 -->
    <div id="giftDisplayArea">
        <div class="card-frame">
            <div class="card-rarity" id="giftRarity">★☆☆☆☆</div>
            <img src="" alt="圖示" class="card-image" id="giftImg">
            <div class="card-name" id="giftName">載入中...</div>
            <div class="card-desc" id="giftDesc">請稍候...</div>

            <div class="req-container">
                <span class="req-label">解鎖所需禮物數量：</span>
                <span class="req-value" id="reqCount">0 個</span>
            </div>

            <div class="req-container total-coins">
                <span class="req-label">滿級總計需要：</span>
                <span class="req-value" id="maxCoins">計算中...</span>
            </div>
        </div>

        <div class="level-selector" id="levelSelector"></div>
    </div>

    <!-- [隨機袋模式] 無圖純文字獎項平鋪列表 -->
    <div class="bag-items-grid" id="bagItemsGrid"></div>

    <!-- [新增] [主播生日模式] 三欄位清單列表 -->
    <div class="streamer-birthday-container" id="streamerBirthdayContainer">
        <table class="birthday-table">
            <thead>
                <tr>
                    <th style="text-align: center;">日期</th>
                    <th>主播名稱</th>
                    <th>簡介</th>
                </tr>
            </thead>
            <tbody id="birthdayTableBody">
                <!-- 由 JS 動態渲染 -->
            </tbody>
        </table>
    </div>

    <!-- 頁尾標楷體免責聲明 -->
    <div class="dex-footer">
        【免責聲明】<br>
        本頁面內容僅供玩家交流研討使用，並非營利目的。<br>
        相關圖像與資料版權皆屬 17LIVE 官方所有。<br><br>
        【哪有賭徒天天輸，只有希璐天天哭。】 by 熊熊<br>

        <div class="collab-title">❖ 貢獻與協作者 ❖</div>
        <div class="collab-list" id="collabList"></div>
    </div>
</div>

<script src="giftsData.js"></script>
<script src="mysteryBagsData.js"></script>
<script src="streamersData.js"></script>

<script>
    let currentMode = 'gifts'; 
    let currentGiftKey = '';

    function init() {
        renderCollaborators();
        switchMode('gifts');
    }

    function switchMode(mode) {
        currentMode = mode;

        document.getElementById("tabGifts").classList.toggle("active", mode === 'gifts');
        document.getElementById("tabBags").classList.toggle("active", mode === 'bags');
        document.getElementById("tabStreamers").classList.toggle("active", mode === 'streamers');

        const giftDisplayArea = document.getElementById("giftDisplayArea");
        const bagHeroPanel = document.getElementById("bagHeroPanel");
        const bagItemsGrid = document.getElementById("bagItemsGrid");
        const selectContainer = document.getElementById("selectContainer");
        const streamerBirthdayContainer = document.getElementById("streamerBirthdayContainer");

        if (mode === 'gifts') {
            document.getElementById("pageTitle").innerText = "17LIVE 升級禮進化圖鑑";
            selectContainer.style.display = "block";
            giftDisplayArea.style.display = "block";
            bagHeroPanel.style.display = "none";
            bagItemsGrid.style.display = "none";
            streamerBirthdayContainer.style.display = "none";

            const db = typeof giftsDatabase !== "undefined" ? giftsDatabase : {};
            currentGiftKey = Object.keys(db)[0] || '';
            renderMainMenu();
            if (currentGiftKey) switchGift(currentGiftKey);

        } else if (mode === 'bags') {
            document.getElementById("pageTitle").innerText = "17LIVE 隨機袋獎勵圖鑑";
            selectContainer.style.display = "block";
            giftDisplayArea.style.display = "none";
            bagHeroPanel.style.display = "block";
            bagItemsGrid.style.display = "flex";
            streamerBirthdayContainer.style.display = "none";

            const db = typeof mysteryBagsDatabase !== "undefined" ? mysteryBagsDatabase : {};
            currentGiftKey = Object.keys(db)[0] || '';
            renderMainMenu();
            if (currentGiftKey) switchGift(currentGiftKey);

        } else if (mode === 'streamers') {
            document.getElementById("pageTitle").innerText = "17 LIVE 主播生日列表";
            selectContainer.style.display = "none";
            giftDisplayArea.style.display = "none";
            bagHeroPanel.style.display = "none";
            bagItemsGrid.style.display = "none";
            streamerBirthdayContainer.style.display = "block";

            renderStreamerBirthdayList();
        }
    }

    function getCurrentDatabase() {
        return currentMode === 'gifts' 
            ? (typeof giftsDatabase !== "undefined" ? giftsDatabase : {})
            : (typeof mysteryBagsDatabase !== "undefined" ? mysteryBagsDatabase : {});
    }

    function renderMainMenu() {
        const giftSelect = document.getElementById("giftSelect");
        if (!giftSelect) return;
        giftSelect.innerHTML = "";

        const activeDB = getCurrentDatabase();

        Object.keys(activeDB).forEach(key => {
            const option = document.createElement("option");
            option.value = key;
            option.innerText = activeDB[key].title;
            if (key === currentGiftKey) {
                option.selected = true;
            }
            giftSelect.appendChild(option);
        });
    }

    function switchGift(giftKey) {
        currentGiftKey = giftKey;
        const activeDB = getCurrentDatabase();

        const giftSelect = document.getElementById("giftSelect");
        if (giftSelect && giftSelect.value !== giftKey) {
            giftSelect.value = giftKey;
        }

        const data = activeDB[currentGiftKey];
        if (!data) return;

        if (currentMode === 'gifts') {
            document.getElementById("maxCoins").innerText = data.maxCoins || "尚未計算";
            renderLevelButtons();
            selectLevel(0);
        } else if (currentMode === 'bags') {
            document.getElementById("bagPrice").innerText = data.maxCoins || "單次金額未定";
            document.getElementById("bagDesc").innerText = data.activityDesc || "暫無活動說明。";

            const bagImgEl = document.getElementById("bagMainImg");
            if (bagImgEl) {
                bagImgEl.onerror = function() {
                    this.onerror = null;
                    const encodedText = encodeURIComponent(data.title || "隨機袋");
                    this.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180"><rect width="100%" height="100%" fill="%23151a21"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23f1c40f" font-size="16" font-weight="bold">${encodedText}</text></svg>`;
                };
                bagImgEl.src = data.img || "";
            }

            renderBagItems(data.items || data.levels || []);
        }
    }

    // 渲染主播生日列表
    function renderStreamerBirthdayList() {
        const tbody = document.getElementById("birthdayTableBody");
        if (!tbody) return;
        tbody.innerHTML = "";

        const streamers = typeof streamersDatabase !== "undefined" ? streamersDatabase : [];

        streamers.forEach(item => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td class="date-col">${item.date || ''}</td>
                <td class="name-col">
                    <a href="${item.url || '#'}" target="_blank" rel="noopener noreferrer" class="streamer-link">
                        ${item.name || ''}
                    </a>
                </td>
                <td class="intro-col">${item.intro || ''}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 隨機袋列表渲染
    function renderBagItems(items) {
        const bagItemsGrid = document.getElementById("bagItemsGrid");
        if (!bagItemsGrid) return;
        bagItemsGrid.innerHTML = "";

        items.forEach(item => {
            const card = document.createElement("div");
            card.className = "bag-item-card";

            const reqText = item.reward || item.reqCount || "無備註";

            card.innerHTML = `
                <div class="bag-item-left">
                    <div class="bag-item-header">
                        <span class="bag-item-tag">${item.tag || item.level || '獎項'}</span>
                        <span class="bag-item-name">${item.name}</span>
                        <span class="bag-item-rarity">${item.rarity || ''}</span>
                    </div>
                    <div class="bag-item-desc">${item.desc || ''}</div>
                </div>
                <div class="bag-item-right">
                    <div class="bag-item-value">${reqText}</div>
                </div>
            `;
            bagItemsGrid.appendChild(card);
        });
    }

    // 升級禮等級按鈕
    function renderLevelButtons() {
        const levelSelector = document.getElementById("levelSelector");
        if (!levelSelector) return;
        levelSelector.innerHTML = ""; 

        const activeDB = getCurrentDatabase();
        const levels = activeDB[currentGiftKey]?.levels || [];

        levels.forEach((lvlData, index) => {
            const btn = document.createElement("button");
            btn.className = "lvl-btn";
            btn.innerText = lvlData.level;
            btn.onclick = () => selectLevel(index);
            levelSelector.appendChild(btn);
        });
    }

    // 切換等級
    function selectLevel(index) {
        const activeDB = getCurrentDatabase();
        const data = activeDB[currentGiftKey]?.levels[index];
        if (!data) return;

        document.getElementById("giftName").innerText = data.name;
        document.getElementById("giftRarity").innerText = data.rarity;
        document.getElementById("giftDesc").innerText = data.desc;
        document.getElementById("reqCount").innerText = data.reqCount;

        const imgEl = document.getElementById("giftImg");
        if (imgEl) {
            imgEl.onerror = function() {
                this.onerror = null;
                const encodedText = encodeURIComponent(data.level);
                this.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><rect width="100%" height="100%" fill="%23151a21"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23f1c40f" font-size="22" font-weight="bold">${encodedText}</text></svg>`;
            };
            imgEl.src = data.img;
        }

        const buttons = document.querySelectorAll('.lvl-btn');
        buttons.forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });
    }

    function renderCollaborators() {
        const collabList = document.getElementById("collabList");
        if (!collabList || typeof collaborators === "undefined") return;
        collabList.innerHTML = "";

        collaborators.forEach(collab => {
            const link = document.createElement("a");
            link.className = "collab-badge";
            link.href = collab.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerText = collab.name;
            collabList.appendChild(link);
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
</script>

</body>
</html>
