        body {
            background-color: #0b0c10;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 外層神魔框體 */
        .dex-container {
            width: 100%;
            max-width: 520px;
            background: linear-gradient(180deg, #1f2833 0%, #0b0c10 100%);
            border: 3px solid #c5a059;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
            padding: 20px;
            position: relative;
        }

        /* 標題區塊 */
        .dex-header {
            text-align: center;
            border-bottom: 2px solid #c5a059;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .dex-header h1 {
            font-size: 22px;
            color: #f39c12;
            text-shadow: 0 0 8px rgba(243, 156, 18, 0.6);
            letter-spacing: 2px;
        }

        /* 禮物主選單按鈕區 */
        .gift-menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            min-height: 40px;
        }

        .gift-menu-btn {
            padding: 8px 12px;
            background: #111;
            border: 1px solid #45a29e;
            color: #66fcf1;
            font-weight: bold;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .gift-menu-btn:hover, .gift-menu-btn.active {
            background: #45a29e;
            color: #0b0c10;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.6);
        }

        /* 卡片展示區 */
        .card-frame {
            position: relative;
            background: #151a21;
            border: 2px solid #45a29e;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            overflow: hidden;
        }

        .card-rarity {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            color: #fff;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            z-index: 2;
        }

        /* 改為方形卡片展示圖案樣式 */
        .card-image {
            width: 100%;
            max-width: 200px;
            height: 200px;
            margin: 10px auto;
            border-radius: 8px; /* 方形帶質感微圓角 */
            border: 3px solid #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
            object-fit: cover;
            transition: transform 0.3s ease;
            background-color: #000;
            display: block;
        }

        .card-image:hover {
            transform: scale(1.03);
        }

        .card-name {
            font-size: 20px;
            font-weight: bold;
            color: #66fcf1;
            margin-top: 8px;
        }

        .card-desc {
            font-size: 13px;
            color: #c5a059;
            margin: 8px 0;
            min-height: 38px;
        }

        /* 升級所需禮物數量標籤區 */
        .req-container {
            margin: 15px 0 5px 0;
            background: rgba(31, 40, 51, 0.8);
            border: 1px solid #c5a059;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .req-label {
            font-size: 13px;
            color: #45a29e;
            font-weight: bold;
        }

        .req-value {
            font-size: 14px;
            color: #f1c40f;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(241, 196, 15, 0.5);
        }

        /* 等級選擇按鈕區 */
        .level-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 6px;
            margin-top: 15px;
        }

        .lvl-btn {
            padding: 8px 0;
            background: #1f2833;
            border: 1px solid #c5a059;
            color: #c5a059;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

            background: #c5a059;
            color: #0b0c10;
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.8);
        }
    </style>

    let currentGiftKey = 'cake';

    function init() {
        renderMainMenu();
        switchGift('cake');
    }

    function renderMainMenu() {
        const giftMenu = document.getElementById("giftMenu");
        if (!giftMenu) return;
        giftMenu.innerHTML = "";

        Object.keys(giftsDatabase).forEach(key => {
            const btn = document.createElement("button");
            btn.className = `gift-menu-btn ${key === currentGiftKey ? 'active' : ''}`;
            btn.innerText = giftsDatabase[key].title;
            btn.onclick = () => switchGift(key);
            giftMenu.appendChild(btn);
        });
    }

    function switchGift(giftKey) {
        currentGiftKey = giftKey;

        const menuBtns = document.querySelectorAll('.gift-menu-btn');
        const keys = Object.keys(giftsDatabase);
        menuBtns.forEach((btn, index) => {
            if (keys[index] === giftKey) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        renderLevelButtons();
        selectLevel(0);
    }

    function renderLevelButtons() {
        const levelSelector = document.getElementById("levelSelector");
        if (!levelSelector) return;
        levelSelector.innerHTML = ""; 

        const levels = giftsDatabase[currentGiftKey].levels;

        levels.forEach((lvlData, index) => {
            const btn = document.createElement("button");
            btn.className = "lvl-btn";
            btn.innerText = lvlData.level;
            btn.onclick = () => selectLevel(index);
            levelSelector.appendChild(btn);
        });
    }

    function selectLevel(index) {
        const data = giftsDatabase[currentGiftKey].levels[index];
        if (!data) return;

        document.getElementById("giftName").innerText = data.name;
        document.getElementById("giftRarity").innerText = data.rarity;
        document.getElementById("giftDesc").innerText = data.desc;
        document.getElementById("reqCount").innerText = data.reqCount;
        
        const imgEl = document.getElementById("giftImg");
        if (imgEl) {
            imgEl.src = data.img;
            imgEl.onerror = function() {
                this.onerror = null;
                const encodedText = encodeURIComponent(data.level);
                this.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><rect width="100%" height="100%" fill="%23151a21"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23f1c40f" font-size="22" font-weight="bold">${encodedText}</text></svg>`;
            };
        }

        const buttons = document.querySelectorAll('.lvl-btn');
        buttons.forEach((btn, i) => {
            if (i === index) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
</script>

</body>
</html>
