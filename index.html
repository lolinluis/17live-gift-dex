<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17LIVE 圖鑑與主播生日列表 - 神魔風格版</title>

    <!-- [不蒜子 Busuanzi] 免費瀏覽人次統計腳本 (使用 https 安全連線) -->
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

    <!-- 獨立 CSS 樣式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dex-container">
    <!-- 頂頁 Tab 頁籤 -->
    <div class="nav-tabs">
        <button class="tab-btn active" id="tabGifts" onclick="switchMode('gifts')">升級禮</button>
        <button class="tab-btn" id="tabBags" onclick="switchMode('bags')">隨機袋</button>
        <button class="tab-btn" id="tabStreamers" onclick="switchMode('streamers')">主播生日</button>
        <button class="tab-btn" id="tabQA" onclick="switchMode('qa')">問題QA</button>
    </div>

    <!-- 標題區 -->
    <div class="dex-header-container">
        <div class="dex-header">
            <h1 id="pageTitle">17LIVE 升級禮進化圖鑑</h1>
            <div class="subtitle">(非官方 - 持續更新中)</div>
            <div class="subtitle">˚ʚ♡ɞ˚恭喜 🎀伊娜いな 白玉🖤 30等畢業囉！˚ʚ♡ɞ˚</div>
            <div class="subtitle">✨白玉🖤12月份群聚募集中✨</div>
            <div class="subtitle">～活動詳情請見白玉主頁貼文～</div>
        </div>
    </div>

    <!-- [升級禮] 1列4格 縮圖列表區 -->
    <div class="gift-grid-container" id="giftGridContainer"></div>

    <!-- [隨機袋] 橫向長方形卡片列表 -->
    <div class="bag-list-container" id="bagListContainer"></div>

    <!-- [隨機袋模式] 頂部隨機袋主圖與說明面板 -->
    <div class="bag-hero-panel" id="bagHeroPanel">
        <img class="bag-main-img" id="bagMainImg" src="" alt="隨機袋圖示">
        <div class="bag-desc-box" id="bagDesc">活動說明...</div>
        <div class="bag-price-container">
            <span class="req-label" style="color:#e67e22;">單次開袋金額：</span>
            <span class="req-value" id="bagPrice">300 寶寶幣 / 次</span>
        </div>
    </div>

    <!-- [升級禮模式] 詳細圖鑑頁面 -->
    <div id="giftDisplayArea" style="display: none;">
        <div class="card-frame">
            <div class="card-rarity" id="giftRarity">★☆☆☆☆</div>
            <img src="" alt="圖示" class="card-image" id="giftImg">
            <div class="card-name" id="giftName">載入中...</div>
            <div class="card-desc" id="giftDesc">請稍候...</div>

            <div class="req-container">
                <span class="req-label">解鎖所需禮物數量：</span>
                <span class="req-value" id="reqCount">0 個</span>
            </div>

            <div class="req-container total-coins">
                <span class="req-label">滿級總計需要：</span>
                <span class="req-value" id="maxCoins">計算中...</span>
            </div>
        </div>

        <div class="level-selector" id="levelSelector"></div>
    </div>

    <!-- [隨機袋模式] 無圖純文字獎項平鋪列表 -->
    <div class="bag-items-grid" id="bagItemsGrid"></div>

    <!-- [主播生日模式] 兩行卡片清單列表 -->
    <div class="streamer-birthday-container" id="streamerBirthdayContainer"></div>

    <!-- [問題QA模式] 可伸縮手風琴內容區 -->
    <div class="qa-container" id="qaContainer"></div>

    <!-- 頁尾免責聲明與計數器 -->
    <div class="dex-footer">
        【免責聲明】<br>
        本頁面內容僅供玩家交流研討使用，並非營利目的。<br>
        相關圖像與資料版權皆屬 17LIVE 官方所有。<br><br>
        【哪有賭徒天天輸，只有希璐天天哭。】 by 熊熊<br><br>

        <div class="collab-title">❖ 貢獻與協作者 ❖</div>
        <div class="collab-list" id="collabList"></div>

        <!-- [不蒜子] 瀏覽人次容器 -->
        <div>
            <div class="counter-container">
                <span class="counter-label">❖ 累積瀏覽人次：</span>
                <span class="counter-value" id="busuanzi_value_page_pv">...</span> 次
            </div>
        </div>
    </div>
</div>

<!-- 右側固定懸浮返回列表按鈕 -->
<button class="btn-floating-back" id="btnFloatingBack" onclick="backToMenu()">◀<br>返<br>回</button>

<!-- 資料檔 -->
<script src="giftsData.js"></script>
<script src="mysteryBagsData.js"></script>
<script src="streamersData.js"></script>
<script src="qaData.js"></script>

<!-- UI 視圖模組 -->
<script src="giftsView.js"></script>
<script src="bagsView.js"></script>
<script src="streamersView.js"></script>
<script src="qa.js"></script>

<!-- 主控邏輯 Script -->
<script>
    let currentMode = 'gifts'; 
    let currentGiftKey = '';

    function init() {
        renderCollaborators();
        switchMode('gifts');
    }

    function switchMode(mode) {
        currentMode = mode;

        document.getElementById("tabGifts").classList.toggle("active", mode === 'gifts');
        document.getElementById("tabBags").classList.toggle("active", mode === 'bags');
        document.getElementById("tabStreamers").classList.toggle("active", mode === 'streamers');
        document.getElementById("tabQA").classList.toggle("active", mode === 'qa');

        const elements = {
            giftGridContainer: document.getElementById("giftGridContainer"),
            giftDisplayArea: document.getElementById("giftDisplayArea"),
            bagListContainer: document.getElementById("bagListContainer"),
            bagHeroPanel: document.getElementById("bagHeroPanel"),
            bagItemsGrid: document.getElementById("bagItemsGrid"),
            streamerBirthdayContainer: document.getElementById("streamerBirthdayContainer"),
            qaContainer: document.getElementById("qaContainer")
        };

        Object.values(elements).forEach(el => { if (el) el.style.display = "none"; });

        // 切換主頁籤時隱藏懸浮返回按鈕
        document.getElementById("btnFloatingBack").style.display = "none";

        if (mode === 'gifts') {
            document.getElementById("pageTitle").innerText = "17LIVE 升級禮進化圖鑑";
            elements.giftGridContainer.style.display = "grid";
            GiftsView.renderGrid("giftGridContainer", openGiftDetail);

        } else if (mode === 'bags') {
            document.getElementById("pageTitle").innerText = "17LIVE 隨機袋獎勵圖鑑";
            elements.bagListContainer.style.display = "flex";
            BagsView.renderList("bagListContainer", openBagDetail);

        } else if (mode === 'streamers') {
            document.getElementById("pageTitle").innerText = "17 LIVE 主播生日列表";
            elements.streamerBirthdayContainer.style.display = "flex";
            StreamersView.renderList("streamerBirthdayContainer");

        } else if (mode === 'qa') {
            document.getElementById("pageTitle").innerText = "17LIVE 常見問題 QA";
            elements.qaContainer.style.display = "flex";
            if (typeof renderQAList === "function") renderQAList();
        }
    }

    function openGiftDetail(giftKey) {
        currentGiftKey = giftKey;
        document.getElementById("giftGridContainer").style.display = "none";
        document.getElementById("giftDisplayArea").style.display = "block";
        
        // 顯示懸浮返回按鈕
        document.getElementById("btnFloatingBack").style.display = "flex";
        
        window.scrollTo(0, 0); // 瞬間置頂

        GiftsView.renderDetail(giftKey);
    }

    function openBagDetail(bagKey) {
        currentGiftKey = bagKey;
        document.getElementById("bagListContainer").style.display = "none";
        document.getElementById("bagHeroPanel").style.display = "block";
        document.getElementById("bagItemsGrid").style.display = "flex";

        // 顯示懸浮返回按鈕
        document.getElementById("btnFloatingBack").style.display = "flex";

        window.scrollTo(0, 0); // 瞬間置頂

        BagsView.renderDetail(bagKey);
    }

    function backToMenu() {
        window.scrollTo(0, 0); // 瞬間置頂

        // 隱藏懸浮返回按鈕
        document.getElementById("btnFloatingBack").style.display = "none";

        if (currentMode === 'gifts') {
            document.getElementById("giftDisplayArea").style.display = "none";
            document.getElementById("giftGridContainer").style.display = "grid";
        } else if (currentMode === 'bags') {
            document.getElementById("bagHeroPanel").style.display = "none";
            document.getElementById("bagItemsGrid").style.display = "none";
            document.getElementById("bagListContainer").style.display = "flex";
        }
    }

    function renderCollaborators() {
        const collabList = document.getElementById("collabList");
        if (!collabList || typeof collaborators === "undefined") return;
        collabList.innerHTML = "";

        collaborators.forEach(collab => {
            const link = document.createElement("a");
            link.className = "collab-badge";
            link.href = collab.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerText = collab.name;
            collabList.appendChild(link);
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
</script>

</body>
</html>
